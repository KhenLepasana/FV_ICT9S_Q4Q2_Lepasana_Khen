<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Score Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0faff;
      font-family: 'Segoe UI', sans-serif;
    }
    .header {
      background-color: #00bfff;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
    }
    .card img {
      height: 200px;
      object-fit: cover;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
    .grade-input {
      font-size: 1.5rem;
      text-align: center;
      background-color: #f1f1f1;
      border-radius: 8px;
      padding: 10px;
      width: 80px;
      margin: auto;
      border: none;
    }
  </style>
</head>
<body>

  <div class="header">Score Analyzer</div>

  <div class="container mt-4">
    <div class="row text-center justify-content-center g-4">
      <div class="col-md-4">
        <div class="card shadow">
          <img src="https://img.freepik.com/free-vector/hand-drawn-science-education-background_23-2148499325.jpg?semt=ais_hybrid&w=740" class="card-img-top" alt="Science">
          <div class="card-body">
            <h5 class="card-title">Science</h5>
            <input type="number" id="science" class="grade-input">
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow">
          <img src="https://lh3.googleusercontent.com/proxy/OM3kyUYvIUowRXjxJe9GdoW-BB4tJZ3gcuipV4zS4NBgtpv8XNqAt_LzBswkmvt47SL5su2DitWx8cs3MTJJIYNmrpJVs7XUWpaR9heljtHDMIFd5OJB5f6SC-z86IVFUgg" class="card-img-top" alt="Social">
          <div class="card-body">
            <h5 class="card-title">Social Studies</h5>
            <input type="number" id="social" class="grade-input">
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow">
          <img src="https://superblog.supercdn.cloud/site_cuid_ckucmy84h97811nplkx3qfbgx/images/360f2268659604icxo3nduxkus3qgyb0jm5g26nrz36dy-1706005957048-compressed.jpg" class="card-img-top" alt="English">
          <div class="card-body">
            <h5 class="card-title">English</h5>
            <input type="number" id="english" class="grade-input">
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-4">
      <button class="btn btn-info text-white px-4 py-2" onclick="calculateAverage()">Get Rating</button>
    </div>
  </div>

  <script>
    function calculateAverage() {
      var english = +document.getElementById("english").value;
      var science = +document.getElementById("science").value;
      var social = +document.getElementById("social").value;

      var average = (science + english + social) / 3;

      var rating = "";
      switch (true) {
        case (average >= 94 && average <= 100):
          rating = "Excellent";
          break;
        case (average >= 87 && average < 94):
          rating = "Above Satisfactory";
          break;
        case (average >= 80 && average < 87):
          rating = "Satisfactory";
          break;
        case (average >= 75 && average < 80):
          rating = "Needs Improvement";
          break;
        case (average >= 70 && average < 75):
          rating = "Poor";
          break;
        default:
          rating = "Invalid grade entered.";
      }

      window.alert("Average: " + average + "\n Rating Average: " + rating);
    }
  </script>

</body>
</html>
